<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="interviewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="scoreGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="intGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="500" rx="16" fill="url(#interviewBg)"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 784 0 C 792.84 0 800 7.16 800 16 L 800 44 L 0 44 Z" fill="#0f172a"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="5" fill="#10b981"/>

  <!-- URL Bar -->
  <rect x="100" y="10" width="460" height="24" rx="6" fill="#1e293b"/>
  <text x="120" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">localhost:8080/interview-session • Java Spring Boot + Ollama AI Engine</text>

  <rect x="580" y="12" width="135" height="20" rx="4" fill="#311302" stroke="#ea580c" stroke-width="1"/>
  <circle cx="592" cy="22" r="3" fill="#f97316"/>
  <text x="602" y="26" font-family="sans-serif" font-size="10" font-weight="700" fill="#fb923c">JAVA &amp; SPRING BOOT</text>

  <!-- App Header -->
  <g transform="translate(30, 60)">
    <rect width="740" height="50" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Smart Mock Interview Simulator</text>
    
    <rect x="320" y="12" width="105" height="26" rx="6" fill="#1e293b"/>
    <text x="372" y="29" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Domain: Backend</text>

    <rect x="435" y="12" width="95" height="26" rx="6" fill="#1e293b"/>
    <text x="482" y="29" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Topic: Java OOP</text>

    <rect x="540" y="12" width="95" height="26" rx="6" fill="#1e3a5f"/>
    <text x="587" y="29" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38bdf8">Level: Intermediate</text>

    <rect x="645" y="12" width="80" height="26" rx="6" fill="#064e3b"/>
    <text x="685" y="29" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Q3 of 5</text>
  </g>

  <!-- Main Content Split -->
  <!-- Left Side -->
  <g transform="translate(30, 122)">
    <rect width="440" height="150" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="130" height="22" rx="4" fill="#1e293b"/>
    <text x="25" y="30" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">Ollama Prompt Prompted</text>

    <text x="15" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Question 3: Polymorphism &amp; Method Overriding</text>
    <text x="15" y="85" font-family="sans-serif" font-size="12" fill="#cbd5e1">"Explain runtime polymorphism in Java and contrast how method</text>
    <text x="15" y="103" font-family="sans-serif" font-size="12" fill="#cbd5e1">overriding behaves compared to static method hiding."</text>

    <rect x="15" y="118" width="410" height="24" rx="4" fill="#0b1329"/>
    <text x="25" y="134" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Candidate Answer Submitted via REST API POST • Processed in 420ms</text>
  </g>

  <!-- Feedback & Analysis Box -->
  <g transform="translate(30, 284)">
    <rect width="440" height="186" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Automated LLM Evaluation Feedback</text>

    <rect x="20" y="45" width="400" height="56" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="32" y="66" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">✓ Key Strengths Identified:</text>
    <text x="32" y="84" font-family="sans-serif" font-size="11" fill="#a7f3d0">Clear explanation of dynamic method dispatch and JVM vtable lookup.</text>

    <rect x="20" y="112" width="400" height="56" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1"/>
    <text x="32" y="133" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">⚡ Recommendation for Distinction:</text>
    <text x="32" y="151" font-family="sans-serif" font-size="11" fill="#fde68a">Elaborate on how static method hiding applies to class inheritance hierarchy.</text>
  </g>

  <!-- Right Side: Metrics & Score Breakdown -->
  <g transform="translate(490, 122)">
    <rect width="280" height="348" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Evaluation Metrics</text>

    <g transform="translate(20, 50)">
      <rect width="240" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="sans-serif" font-size="11" fill="#94a3b8">Overall Session Score</text>
      <text x="20" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#38bdf8">8.5<tspan font-size="16" fill="#64748b">/10</tspan></text>
      <rect x="140" y="48" width="85" height="26" rx="13" fill="#064e3b"/>
      <text x="182" y="65" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">Strong Fit</text>
    </g>

    <g transform="translate(20, 165)">
      <text x="0" y="15" font-family="sans-serif" font-size="11" fill="#cbd5e1">Concept Clarity</text>
      <text x="240" y="15" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">90%</text>
      <rect x="0" y="24" width="240" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="24" width="216" height="6" rx="3" fill="url(#scoreGauge)"/>

      <text x="0" y="55" font-family="sans-serif" font-size="11" fill="#cbd5e1">Technical Depth</text>
      <text x="240" y="55" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">85%</text>
      <rect x="0" y="64" width="240" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="64" width="204" height="6" rx="3" fill="url(#scoreGauge)"/>

      <text x="0" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1">Response Structure</text>
      <text x="240" y="95" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">88%</text>
      <rect x="0" y="104" width="240" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="104" width="211" height="6" rx="3" fill="url(#scoreGauge)"/>
    </g>

    <g transform="translate(20, 295)">
      <rect width="240" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="19" r="4" fill="#10b981"/>
      <text x="28" y="23" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">MySQL: Session Saved #402</text>
    </g>
  </g>
</svg>

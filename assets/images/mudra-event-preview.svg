<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="mudraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="heroCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="800" height="500" rx="16" fill="url(#mudraBg)"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Browser Title Bar -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 784 0 C 792.84 0 800 7.16 800 16 L 800 44 L 0 44 Z" fill="#0f172a"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="5" fill="#10b981"/>

  <!-- URL Bar -->
  <rect x="100" y="10" width="460" height="24" rx="6" fill="#1e293b"/>
  <text x="120" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">https://mudraevent.co.in/ • Live Website</text>

  <!-- Live Badge on Bar -->
  <rect x="580" y="12" width="105" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="592" cy="22" r="3" fill="#10b981"/>
  <text x="602" y="26" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">LIVE WEBSITE</text>

  <!-- App Navbar -->
  <rect x="30" y="60" width="740" height="48" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="50" y="89" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f59e0b" letter-spacing="1">MUDRA EVENTS</text>
  <text x="210" y="88" font-family="sans-serif" font-size="12" fill="#cbd5e1">Services</text>
  <text x="290" y="88" font-family="sans-serif" font-size="12" fill="#cbd5e1">Packages</text>
  <text x="375" y="88" font-family="sans-serif" font-size="12" fill="#cbd5e1">Bookings</text>
  <text x="460" y="88" font-family="sans-serif" font-size="12" fill="#cbd5e1">Reviews &amp; Ratings</text>

  <rect x="650" y="70" width="100" height="28" rx="6" fill="url(#goldAccent)"/>
  <text x="700" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Book Event</text>

  <!-- Hero Banner of App -->
  <rect x="30" y="122" width="740" height="150" rx="10" fill="url(#heroCard)" stroke="#334155" stroke-width="1"/>
  
  <text x="55" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Premium Event Management &amp; Bookings</text>
  <text x="55" y="185" font-family="sans-serif" font-size="13" fill="#94a3b8">Django-powered service catalog, customer bookings &amp; automated scheduling</text>

  <!-- Tags on App Hero -->
  <rect x="55" y="205" width="85" height="24" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="97" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#93c5fd">Django MVT</text>

  <rect x="150" y="205" width="75" height="24" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="187" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#86efac">MySQL DB</text>

  <rect x="235" y="205" width="115" height="24" rx="12" fill="#581c87" stroke="#a855f7" stroke-width="1"/>
  <text x="292" y="221" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#d8b4fe">Railway Hosted</text>

  <!-- Decorative Booking Workflow preview inside hero -->
  <g transform="translate(520, 140)">
    <rect width="230" height="114" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1" filter="url(#cardGlow)"/>
    <text x="15" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Quick Booking Step 2/3</text>
    <rect x="15" y="38" width="200" height="6" rx="3" fill="#1e293b"/>
    <rect x="15" y="38" width="130" height="6" rx="3" fill="#38bdf8"/>
    <text x="15" y="65" font-family="sans-serif" font-size="10" fill="#cbd5e1">Service: Wedding Floral Stage</text>
    <text x="15" y="82" font-family="sans-serif" font-size="10" fill="#cbd5e1">Date: Selected • Status: Confirmed</text>
    <rect x="15" y="92" width="90" height="16" rx="4" fill="#10b981"/>
    <text x="60" y="104" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">Ready to Submit</text>
  </g>

  <!-- Service Cards Row -->
  <!-- Card 1 -->
  <g transform="translate(30, 290)">
    <rect width="233" height="180" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <rect x="15" y="15" width="203" height="75" rx="6" fill="#1e293b"/>
    <text x="25" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Stage &amp; Floral Decor</text>
    <text x="15" y="112" font-family="sans-serif" font-size="12" font-weight="700" fill="#f3f4f6">Dynamic Package Setup</text>
    <text x="15" y="130" font-family="sans-serif" font-size="10" fill="#9ca3af">Custom decoration quotes, dates</text>
    <text x="15" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">★ 4.9 (Customer Reviews)</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(283, 290)">
    <rect width="233" height="180" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <rect x="15" y="15" width="203" height="75" rx="6" fill="#1e293b"/>
    <text x="25" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Catering &amp; Banquets</text>
    <text x="15" y="112" font-family="sans-serif" font-size="12" font-weight="700" fill="#f3f4f6">Booking Workflows</text>
    <text x="15" y="130" font-family="sans-serif" font-size="10" fill="#9ca3af">Slot reservations &amp; admin alerts</text>
    <text x="15" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">★ 5.0 (Customer Reviews)</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(536, 290)">
    <rect width="234" height="180" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <rect x="15" y="15" width="204" height="75" rx="6" fill="#1e293b"/>
    <text x="25" y="55" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Admin Dashboard</text>
    <text x="15" y="112" font-family="sans-serif" font-size="12" font-weight="700" fill="#f3f4f6">Event Management</text>
    <text x="15" y="130" font-family="sans-serif" font-size="10" fill="#9ca3af">Django admin with MySQL queries</text>
    <text x="15" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Production Ready</text>
  </g>
</svg>
